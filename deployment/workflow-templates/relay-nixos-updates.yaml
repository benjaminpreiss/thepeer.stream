name: Propose and auto-merge relay NixOS updates

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relay-nixos-lock-updates
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    uses: benjaminpreiss/themoss.net/.github/workflows/lock-updates.yml@bdf91bcd0a36d729e9fed9a28b8ca3c508543160
    with:
      toolkit-revision: 'bdf91bcd0a36d729e9fed9a28b8ca3c508543160'
      app-policy-file: '.github/app-permissions.json'
      update-command: 'nix flake update && rustup toolchain install 1.95.0 --profile minimal && cargo +1.95.0 update'
      test-command: 'bash deployment/tests/integration.sh'
      # Exact job/check names must also be required by classic branch protection;
      # the shared workflow refuses to auto-merge if that cannot be verified.
      required-checks: 'Direct/Relay core, desktop helper and host JNI,Build relay and NixOS'
    secrets:
      APP_ID: ${{ secrets.RELAY_UPDATE_APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.RELAY_UPDATE_APP_PRIVATE_KEY }}
