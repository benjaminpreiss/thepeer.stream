name: Propose and auto-merge relay NixOS updates

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relay-nixos-lock-updates
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    uses: benjaminpreiss/themoss.net/.github/workflows/lock-updates.yml@3074f7c386b4a7d8c0b3a2cd2f7f72ef3d1f6768
    with:
      toolkit-revision: '3074f7c386b4a7d8c0b3a2cd2f7f72ef3d1f6768'
      app-policy-file: '.github/app-permissions.json'
      update-command: 'nix flake update && rustup toolchain install 1.95.0 --profile minimal && cargo +1.95.0 update'
      test-command: 'bash deployment/tests/integration.sh'
      # Exact job/check names must also be required by classic branch protection;
      # the shared workflow refuses to auto-merge if that cannot be verified.
      # The existing native-check job contains commas in its name, so this
      # comma-delimited audit names only the relay check. Branch protection
      # still requires BOTH jobs; GitHub auto-merge waits for all of them.
      required-checks: 'Build relay and NixOS'
    secrets:
      APP_ID: ${{ secrets.RELAY_UPDATE_APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.RELAY_UPDATE_APP_PRIVATE_KEY }}
