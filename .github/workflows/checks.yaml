name: Build and test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-checks:
    name: Direct/Relay core, desktop helper and host JNI
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CARGO_INCREMENTAL: "0"
      THEPEER_RUST_TOOLCHAIN: "1.95.0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Fetch locked build dependencies (not tunnel participants)
        run: |
          rustup toolchain install "$THEPEER_RUST_TOOLCHAIN" --profile minimal --component rustfmt
          cargo +"$THEPEER_RUST_TOOLCHAIN" fetch --locked
          mkdir -p apps/android-controller/.local-test/scanner
          curl --fail --location --proto '=https' --tlsv1.2 \
            https://repo.maven.apache.org/maven2/com/google/zxing/core/3.5.3/core-3.5.3.jar \
            -o apps/android-controller/.local-test/scanner/core-3.5.3.jar
          echo '8d8064c1636fdaef7189dd9055c7d59950a8940a12f2293956446ec3c109fd82  apps/android-controller/.local-test/scanner/core-3.5.3.jar' | sha256sum --check
      - name: Test release packaging and installer without network access
        run: python3 -m unittest discover -s tests/host -p '*_test.py'
      - name: Prepare the reviewed transport once
        run: |
          echo "THEPEER_PREPARED_WORKSPACE=$(bash patches/saorsa-transport/prepare-native.sh)" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
      - name: Test shared core and helper (loopback only)
        run: |
          cargo +"$THEPEER_RUST_TOOLCHAIN" fmt --all --check
          bash scripts/test-native.sh
      - name: Test scanner, state, native receipts and application fixtures
        run: |
          bash apps/android-controller/test-scanner.sh
          node --test apps/android-controller/tests/native-stage.test.mjs apps/android-controller/tests/application-fixture.test.mjs tests/host/repository-layout.test.mjs
      - name: Test real terminal QR to scanner to JNI to HTTP and Stop
        run: bash apps/android-controller/test-routing-native.sh
